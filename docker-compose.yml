name: mindora

services:
  db:
    image: postgres:16-alpine
    container_name: mindora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mindora}
    ports:
      # If port 5432 is in use on your host machine, set POSTGRES_PORT=5433 in .env
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mindora_pg_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mindora}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mindora_pg_data:
    driver: local
